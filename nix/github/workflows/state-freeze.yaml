name: Plan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-production
  cancel-in-progress: false

jobs:
  frozen:
    name: Resource operations paused for backend cutover
    # This workflow subscribes only to workflow_dispatch; this job cannot run.
    if: github.event_name == 'repository_dispatch'
    runs-on: namespace-profile-quantile-4x8
    steps:
      - name: No resource Plan during backend migration
        run: exit 1
