# Runtime shell loading handles validation; avoid evaluation-time secret resolution.
secretspec:
  enable: false

# The integration launcher uses ngrok; allow this package only.
nixpkgs:
  permitted_unfree_packages:
    - ngrok

inputs:
  site:
    url: git+file:.
    flake: true
  factory:
    follows: site/factory
  nixpkgs:
    follows: site/nixpkgs
  devenv:
    follows: site/devenv
  git-hooks:
    follows: site/git-hooks
  go-overlay:
    follows: site/go-overlay
  llm-agents:
    follows: site/llm-agents
  mk-shell-bin:
    follows: site/mk-shell-bin
  nix2container:
    follows: site/nix2container
