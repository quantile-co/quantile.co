name: Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  production:
    name: Infrastructure
    uses: quantile-co/factory/.github/workflows/plan.yaml@d500b2ce146347a5749d55ab4b40b66733002424
    with:
      tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      gcp_folder_id: ${{ vars.GCP_QUANTILE_CO_FOLDER_ID }}
      gcp_maintainers: ${{ vars.GCP_MAINTAINERS }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
