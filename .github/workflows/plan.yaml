name: Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  production:
    name: Infrastructure
    uses: quantile-co/factory/.github/workflows/plan.yaml@b9f948bcac26b50257b90186f499acfd7e7a8b2c
    with:
      tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      gcp_folder_id: ${{ vars.GCP_QUANTILE_CO_FOLDER_ID }}
      gcp_maintainers: ${{ vars.GCP_MAINTAINERS }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}

  # Initial reader access is part of the plan, so review that plan as ciphertext
  # first. Remove this job and its local tools after the approved access grant.
  handoff:
    name: Encrypt the verified private saved plan (temporary)
    needs: production
    if: >-
      success() &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor) &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.triggering_actor)
    runs-on: namespace-profile-quantile-4x8
    environment: prod
    concurrency:
      group: factory-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          extra_nix_config: |
            experimental-features = nix-command flakes
            require-sigs = true
            extra-substituters = https://devenv.cachix.org https://quantile-co.cachix.org https://cache.numtide.com https://cachix.cachix.org https://pre-commit-hooks.cachix.org https://go-overlay.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= quantile-co.cachix.org-1:OM+kQzUqP3Ija8QQMUxvQNs97u6PB5/s83ZJe7c9WIQ= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= pre-commit-hooks.cachix.org-1:Pkk3Panw5AW24TOv6kz3PvLhlH8puAsJTBbOPmBo7Rc= go-overlay.cachix.org-1:rJ155O3K6WUyUcoKE4MqcC6JcLlK2vPXnP5/76BxWD8=

      - name: Encrypt the exact successful Plan artifact
        env:
          SECRETSPEC_PROFILE: check
          GH_TOKEN: ${{ github.token }}
          GCP_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_BACKEND_PREFIX: repository/prod
          PLAN_RUN_ID: ${{ github.run_id }}
          PLAN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cli="$(nix build --no-link --print-out-paths '.#devenv-cli')/bin/devenv"
          "$cli" shell -- bash .github/scripts/temporary-private-plan-handoff.sh

      - name: Publish only encrypted ciphertext
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-plan/plan.tfplan.age
          if-no-files-found: error
          retention-days: 1

      - name: Remove local ciphertext
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/encrypted-plan"
