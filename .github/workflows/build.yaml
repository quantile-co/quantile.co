name: Build

on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Reviewed 40-character public application commit
        required: true
        type: string
      check_run_id:
        description: Successful exact-source public Check run; source must be on main
        required: true
        type: string
      version:
        description: Reviewed application release version (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  all:
    name: Build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor) &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.triggering_actor)
    concurrency:
      group: source-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    runs-on: namespace-profile-quantile-4x8
    timeout-minutes: 30
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.app_sha }}
          path: source
          persist-credentials: false

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          extra_nix_config: require-sigs = true

      - name: Publish reviewed source release
        working-directory: tooling
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          APP_SHA: ${{ inputs.app_sha }}
          CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          direnv="$(nix build --no-link --print-out-paths '.#direnv')/bin/direnv"
          "$direnv" allow .
          "$direnv" exec . ./scripts/github/build.sh
