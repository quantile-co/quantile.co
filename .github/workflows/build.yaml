name: Build

on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Reviewed 40-character public application commit
        required: true
        type: string
      check_run_id:
        description: Successful protected-main public Check run for this commit
        required: true
        type: string
      version:
        description: Reviewed application release version (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor)
    runs-on: namespace-profile-quantile
    permissions:
      actions: read
      contents: write
    env:
      APP_SHA: ${{ inputs.app_sha }}
      CHECK_RUN_ID: ${{ inputs.check_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Verify quantile-co/quantile.co Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ && "$CHECK_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REPOSITORY" = quantile-co/quantile.co
          checked=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECK_RUN_ID")
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$APP_SHA" '
            .repository.full_name == $repo and
            .path == ".github/workflows/check.yaml" and
            .event == "push" and .head_branch == "main" and
            .head_sha == $sha and .conclusion == "success"
          ' <<< "$checked" > /dev/null

      - name: Check out quantile-co/quantile.co
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.app_sha }}
          persist-credentials: false

      - name: Package reviewed source and client rules
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_VERSION" = "v$(jq -er '.version' package.json)"
          jq -e '.firestore | (type == "object" and .rules == "firestore.rules")' firebase.json > /dev/null
          test -s firestore.rules
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          printf '%s\n' "$APP_SHA" > "$RUNNER_TEMP/source.sha"
          (cd "$RUNNER_TEMP" && sha256sum source.zip > source.zip.sha256)
          cp firestore.rules "$RUNNER_TEMP/firestore.rules"

      - name: Publish reviewed source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$RELEASE_VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists; inspect any partial release before retrying." >&2
            exit 1
          fi
          notes=$(jq -nc --arg sha "$APP_SHA" --arg check "$CHECK_RUN_ID" \
            --arg build "$GITHUB_RUN_ID" \
            '{app_sha: $sha, check_run_id: $check, build_run_id: $build}')
          existing=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            | jq -c --arg tag "$tag" '[.[] | select(.tag_name == $tag)]')
          case "$(jq 'length' <<< "$existing")" in
            0)
              gh release create "$tag" \
                "$RUNNER_TEMP/source.zip#source.zip" \
                "$RUNNER_TEMP/source.sha#source.sha" \
                "$RUNNER_TEMP/source.zip.sha256#source.zip.sha256" \
                "$RUNNER_TEMP/firestore.rules#firestore.rules" \
                --target "$APP_SHA" --title "Application source $tag" \
                --notes "$notes" --latest=false --draft
              ;;
            1)
              jq -e '.[0].draft == true' <<< "$existing" > /dev/null
              ;;
            *) echo "Multiple releases for $tag; inspect before publishing." >&2; exit 1 ;;
          esac

          # Draft releases are absent from REST /releases/tags until publication.
          release=$(gh release view "$tag" --json tagName,isDraft,targetCommitish,body,assets)
          jq -e --arg tag "$tag" --arg sha "$APP_SHA" --arg check "$CHECK_RUN_ID" '
            .tagName == $tag and .isDraft == true and .targetCommitish == $sha and
            (.body | fromjson | .app_sha == $sha and .check_run_id == $check and
              (.build_run_id | test("^[1-9][0-9]*$"))) and
            ([.assets[].name] | sort) ==
              (["firestore.rules", "source.sha", "source.zip", "source.zip.sha256"] | sort)
          ' <<< "$release" > /dev/null
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$tag" --dir "$RUNNER_TEMP/release"
          for name in source.zip source.sha source.zip.sha256 firestore.rules; do
            digest=$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<< "$release")
            test "$digest" = "sha256:$(sha256sum "$RUNNER_TEMP/release/$name" | cut -d' ' -f1)"
          done
          test "$(< "$RUNNER_TEMP/release/source.sha")" = "$APP_SHA"
          (cd "$RUNNER_TEMP/release" && sha256sum -c source.zip.sha256)
          cmp "$RUNNER_TEMP/release/firestore.rules" "$RUNNER_TEMP/firestore.rules"
          python3 - "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/release/source.zip" <<'PY'
          import sys
          from zipfile import ZipFile

          def files(path):
              with ZipFile(path) as archive:
                  entries = archive.infolist()
                  names = [item.filename for item in entries]
                  if len(names) != len(set(names)):
                      raise SystemExit("Duplicate names in source archive")
                  return {
                      item.filename: (
                          item.external_attr >> 16,
                          item.create_system,
                          None if item.is_dir() else archive.read(item),
                      )
                      for item in entries
                  }

          if files(sys.argv[1]) != files(sys.argv[2]):
              raise SystemExit("Draft source differs from reviewed tracked source")
          PY

          # A previous failed Build may leave an intact draft. Point its notes
          # at this run only after confirming that its assets match this commit.
          gh release edit "$tag" --notes "$notes" --draft=false
          published=
          for attempt in $(seq 1 12); do
            candidate=$(gh api "repos/$GH_REPO/releases/tags/$tag" 2>/dev/null) || { sleep 5; continue; }
            if jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .immutable == true' \
              <<< "$candidate" > /dev/null; then
              published=$candidate
              break
            fi
            sleep 5
          done
          test -n "$published" || {
            echo "Release $tag is not verifiably immutable; inspect before any private Build." >&2
            exit 1
          }
          digest=$(sha256sum "$RUNNER_TEMP/release/source.zip" | cut -d' ' -f1)
          asset_id=$(jq -er --arg digest "sha256:$digest" '
            .assets[] | select(.name == "source.zip" and .digest == $digest) | .id
          ' <<< "$published")
          jq -e --arg sha "$APP_SHA" --arg check "$CHECK_RUN_ID" --arg build "$GITHUB_RUN_ID" '
            .body | fromjson | .app_sha == $sha and .check_run_id == $check and .build_run_id == $build
          ' <<< "$published" > /dev/null
          printf 'Published immutable source release `%s` from Check `%s` (SHA `%s`). Source asset ID `%s`, SHA256 `%s`. No deployment.\n' \
            "$tag" "$CHECK_RUN_ID" "$APP_SHA" "$asset_id" "$digest" >> "$GITHUB_STEP_SUMMARY"
