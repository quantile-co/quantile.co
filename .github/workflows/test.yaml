name: Test

# TODO: Run continuously in batches, testing the main commits and merges that
# accumulated during the previous run. After a green run, start the next batch.
# On failure, automatically bisect to prepare a revert commit and/or run agents to
# attempt a fix-forward. Request human intervention if neither approach succeeds.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_store_dir: /home/runner/.cache/pnpm-store
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=${{ github.repository_owner }},service.name=${{ github.event.repository.name }}

jobs:
  all:
    name: All
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: namespace-profile-factory-4x8;tailscale.spec=quantile
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Tests run the full-history checks first.

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true
            build-dir = ${{ runner.temp }}

      - name: Run checks, then tests
        env:
          TURBO_CACHE: local:rw
        run: |
          direnv="$(nix build --no-link --print-out-paths '.#direnv')/bin/direnv"
          "$direnv" allow .
          "$direnv" exec . pnpm install --frozen-lockfile
          "$direnv" exec . pnpm run github:test
