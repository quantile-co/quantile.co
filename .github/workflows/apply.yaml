name: Apply

on:
  workflow_dispatch:
    inputs:
      plan_artifact_id:
        description: Plan artifact ID (valid for 24 hours)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  production:
    name: Infrastructure
    uses: quantile-co/factory/.github/workflows/apply.yaml@385fda43eadfe7cd6b7fea9b2faab3463011f98f
    with:
      plan_artifact_id: ${{ inputs.plan_artifact_id }}
      tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      gcp_folder_id: ${{ vars.GCP_QUANTILE_CO_FOLDER_ID }}
      gcp_maintainers: ${{ vars.GCP_MAINTAINERS }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # GitHub requires the caller to pass even a protected environment secret by name.
      GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
