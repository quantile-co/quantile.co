name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  all-checks:
    name: All
    runs-on: namespace-profile-quantile
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Check application
        run: pnpm check

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.3

      - name: Initialize without backend
        run: tofu -chdir=tf init -backend=false -input=false

      - name: Check formatting
        run: tofu -chdir=tf fmt -check -recursive

      - name: Validate repository root
        run: tofu -chdir=tf validate

      - name: Initialize application module without backend
        run: tofu -chdir=tf/quantile-co init -backend=false -input=false

      - name: Validate application module
        run: tofu -chdir=tf/quantile-co validate

      - name: Test application module with mocked providers
        run: tofu -chdir=tf/quantile-co test
