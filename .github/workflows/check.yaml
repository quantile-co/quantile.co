name: Check

on:
  pull_request:
  push:
    branches-ignore: [main, "dependabot/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub renders called jobs as "caller / called", so main requires the
  # resulting "All / All" context even though each job is named "All".
  all:
    name: All
    if: github.ref != 'refs/heads/main'
    uses: quantile-co/factory/.github/workflows/check.yaml@385fda43eadfe7cd6b7fea9b2faab3463011f98f

  # Preserve the installed required context until the reviewed Terraform Apply
  # changes it to All / All. This gate cannot pass if Factory checks skip or fail.
  legacy-all:
    name: All
    needs: all
    if: always() && github.ref != 'refs/heads/main'
    runs-on: namespace-profile-quantile-4x8
    timeout-minutes: 2
    steps:
      - name: Require successful Factory checks
        env:
          CHECK_RESULT: ${{ needs.all.result }}
        run: test "$CHECK_RESULT" = success
