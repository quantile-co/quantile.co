name: Check

on:
  # GitHub fork approval must admit the revision before allocating a runner.
  pull_request:
  push:
    # Dependabot branches are checked by their pull requests, not twice.
    branches-ignore: ["dependabot/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_store_dir: /home/runner/.cache/pnpm-store
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=${{ github.repository_owner }},service.name=${{ github.event.repository.name }}

jobs:
  all:
    name: All
    runs-on: namespace-profile-factory-8x16;tailscale.spec=quantile
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Full-history Gitleaks rejects shallow checkouts.

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true
            build-dir = ${{ runner.temp }}

      # GitHub's workflow-job webhook exports these step durations to ClickStack.
      - name: Prepare dev shell
        run: |
          direnv_bin="$(nix build --no-link --print-out-paths '.#direnv')/bin"
          "$direnv_bin/direnv" allow .
          "$direnv_bin/direnv" exec . true
          echo "$direnv_bin" >> "$GITHUB_PATH"

      - name: Install workspace dependencies
        run: direnv exec . pnpm install --frozen-lockfile

      - name: Run checks
        env:
          TURBO_CACHE: local:rw
        run: |
          direnv exec . pnpm run check
