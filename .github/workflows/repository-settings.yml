name: Deploy repository settings

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed plan in this run
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: repository-settings-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and optionally apply
    if: github.ref == 'refs/heads/main' && github.actor == 'aj-welch'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_github_quantile_co_token: ${{ secrets.TERRAFORM_GITHUB_QUANTILE_CO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: q0-a890
          workload_identity_provider: projects/86084514682/locations/global/workloadIdentityPools/github/providers/quantile-co-repositories-oidc

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.3

      - name: Initialize state
        run: >-
          tofu -chdir=.github/tf init -input=false -reconfigure
          -backend-config="bucket=q0-a890-quantile-co-app-tf-state"
          -backend-config="prefix=repository/prod"

      - name: Validate
        run: tofu -chdir=.github/tf validate

      - name: Plan
        run: tofu -chdir=.github/tf plan -input=false -out=plan.tfplan

      - name: Apply exact plan
        if: inputs.apply
        run: tofu -chdir=.github/tf apply -input=false -auto-approve plan.tfplan
