packages:
  - apps/*
  - packages/*

verifyDepsBeforeRun: false

# Reviewed exact Factory releases; normal release-age protection stays enabled.
minimumReleaseAgeExclude:
  - '@quantile-co/factory-amp@0.3.1'
  - '@quantile-co/factory-pi@0.1.12'
  - '@quantile-co/factory-otel@0.5.0'

allowBuilds:
  esbuild: false
  sharp: true
