packages:
  - apps/*
  - packages/*

verifyDepsBeforeRun: false

# Reviewed initial Factory releases; normal release-age protection stays enabled.
minimumReleaseAgeExclude:
  - '@quantile-co/factory-github@0.1.0'
  - '@quantile-co/factory-pi@0.1.0'

allowBuilds:
  esbuild: false
  protobufjs: true
  re2: false
  sharp: true
