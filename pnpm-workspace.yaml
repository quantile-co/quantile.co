packages:
  - apps/*
  - packages/*

verifyDepsBeforeRun: false

# Reviewed exact Factory releases; normal release-age protection stays enabled.
minimumReleaseAgeExclude:
  - '@quantile-co/factory-amp@0.3.2'
  - '@quantile-co/factory-pi@0.1.12'
  - '@quantile-co/factory-otel@0.5.0'

# Remove when the Storybook docgen plugin updates its glob dependency.
overrides:
  '@joshwooding/vite-plugin-react-docgen-typescript@0.7.0>glob': 14.0.6

allowBuilds:
  esbuild: false
  sharp: true
